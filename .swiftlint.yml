included:
  - CallDemoApp
  - CallDemoAppUITests

strict: true

excluded:
  - .ui-test-artifacts
  - DerivedData

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - legacy_multiple
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - toggle_bool

line_length:
  warning: 100
  error: 100
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded:
    - id

type_body_length:
  warning: 300
  error: 300

file_length:
  warning: 500
  error: 500

function_body_length:
  warning: 60
  error: 60

reporter: xcode
